  <section id="staffLogin"><h3>Login Guru / Admin</h3><p class="mut">Guru harus registrasi terlebih dahulu dan menunggu persetujuan admin sekolah.</p><form id="af"><label>Email guru/admin</label><input name="email" type="email" autocomplete="username" required><label>Kata sandi</label><input name="pass" type="password" autocomplete="current-password" required><p class="err" id="aerr"></p><button class="btn" id="abtn" style="width:100%;margin-top:.8rem">Masuk sebagai Guru/Admin</button></form></section>
  <section id="teacherRegister" hidden><h3>Registrasi Guru</h3><p class="mut">Masukkan NPSN sekolah yang sudah terdaftar. Akun guru baru aktif setelah disetujui admin sekolah.</p><form id="teacherForm"><label>NPSN Sekolah (8 digit)</label><input name="npsn" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required placeholder="Masukkan NPSN sekolah"><label>Nama lengkap guru</label><input name="nama" required maxlength="100"><label>Email aktif</label><input name="email" type="email" autocomplete="email" required><label>Kata sandi (minimal 6 karakter)</label><input name="pass" type="password" minlength="6" autocomplete="new-password" required><input type="hidden" name="role" value="guru"><p class="err" id="terr"></p><button class="btn" id="tbtn" style="width:100%;margin-top:.8rem">Daftar sebagai Guru</button></form></section>
  <section id="studentLogin" hidden><h3>Login Siswa</h3><p class="mut">Siswa cukup mengisi NPSN, kelas, rombel, dan nama siswa sesuai data yang didaftarkan sekolah.</p><form id="studentForm"><label>1. NPSN Sekolah (8 digit)</label><input name="npsn" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required placeholder="Masukkan NPSN sekolah"><label>2. Kelas</label><select name="kelas" required><option value="">Pilih kelas</option><option value="1">Kelas 1</option><option value="2">Kelas 2</option><option value="3">Kelas 3</option><option value="4">Kelas 4</option><option value="5">Kelas 5</option><option value="6">Kelas 6</option></select><label>3. Rombel</label><input name="rombel" required maxlength="20" placeholder="Contoh: A"><label>4. Nama siswa</label><input name="nama" required maxlength="100" autocomplete="name" placeholder="Nama lengkap sesuai data sekolah"><p class="err" id="serr"></p><button class="btn" id="sbtn" style="width:100%;margin-top:.8rem">Masuk ke Modul Siswa</button></form></section></div>`;
  showAuthPanel('staffLogin');
  $('af').onsubmit=async e=>{e.preventDefault();$('aerr').textContent='';$('abtn').disabled=true;try{await auth.signInWithEmailAndPassword(e.target.elements.email.value.trim(),e.target.elements.pass.value)}catch(x){$('aerr').textContent=msg(x)}finally{$('abtn').disabled=false}};
  $('teacherForm').onsubmit=async e=>{e.preventDefault();$('terr').textContent='';$('tbtn').disabled=true;authTab='user';try{await submitAuth(e.target);$('terr').textContent='Registrasi dikirim. Akun guru menunggu persetujuan admin sekolah.'}catch(x){$('terr').textContent=msg(x)}finally{$('tbtn').disabled=false}};
  $('studentForm').onsubmit=async e=>{e.preventDefault();$('serr').textContent='';$('sbtn').disabled=true;const npsn=e.target.elements.npsn.value.trim(),kelas=e.target.elements.kelas.value.trim(),rombel=e.target.elements.rombel.value.trim(),nama=e.target.elements.nama.value.trim();try{if(!/^\d{8}$/.test(npsn))throw Error('NPSN harus terdiri dari 8 digit angka.');const sch=await val('schools/'+npsn);if(!sch)throw Error('NPSN sekolah tidak ditemukan atau belum terdaftar.');const members=await val(`s/${npsn}/members`)||{};const norm=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');const wantName=norm(nama),wantRombel=norm(rombel);const found=Object.entries(members).find(([uid,m])=>{if(m?.role!=='siswa'||m?.status!=='aktif'||norm(m.name||m.nama)!==wantName)return false;const mk=norm(m.kelas),mr=norm(m.rombel||m.rombongan_belajar||'');const full=norm(kelas+rombel),spaced=norm(kelas+' '+rombel);const classMatch=(mk===norm(kelas)&&(!mr||mr===wantRombel))||mk===full||mk===spaced||mk===norm(kelas+'-'+rombel)||mk===norm(kelas+'/'+rombel);return classMatch});if(!found)throw Error('Data siswa tidak cocok. Periksa NPSN, kelas, rombel, dan nama; pastikan siswa sudah didaftarkan admin.');await auth.signInAnonymously();const [uid,m]=found;me={uid:auth.currentUser.uid,role:'siswa',npsn,name:m.name||m.nama};school=sch;mem={...m,kelas:m.kelas||kelas,rombel:m.rombel||rombel,studentRecordUid:uid};view='themes';publicShell();await go('themes')}catch(x){$('serr').textContent=msg(x)}finally{$('sbtn').disabled=false}};

async function submitAuth(f){
  const field=n=>{const el=f.elements.namedItem(n);if(!el)throw Error('Kolom formulir tidak ditemukan: '+n+'. Muat ulang halaman dan coba kembali.');return el.value??'';};
  if(authTab==='login'){
    await auth.signInWithEmailAndPassword(field('email').trim(),field('pass'));
    return;
  }
  const npsn=field('npsn').trim(),email=field('email').trim(),nama=field('nama').trim();
  if(!/^\d{8}$/.test(npsn))throw Error('NPSN harus 8 digit angka.');
  if(!nama)throw Error('Nama wajib diisi.');
  const role=authTab==='school'?'admin':field('role');
  // Formulir registrasi guru tidak memiliki kolom kelas; kelas hanya wajib dibaca untuk akun siswa.
  const kelas=(authTab==='user'&&role==='siswa')?field('kelas').trim().toUpperCase():'';
  if(authTab==='user'&&role==='siswa'&&!kelas)throw Error('Kelas siswa wajib diisi.');
  registering=true;
  let uid=null,createdAuth=false;
  try{
    // Buat sesi autentikasi terlebih dahulu, lalu pastikan NPSN benar-benar terdaftar.
    // Pemeriksaan dilakukan setelah autentikasi agar sesuai dengan Rules yang membatasi pembacaan.
    uid=(await auth.createUserWithEmailAndPassword(email,field('pass'))).user.uid;
    createdAuth=true;
    if(authTab==='user'){
      const schoolCheck=await db.ref('schools/'+npsn).get();
      if(!schoolCheck.exists()) throw Error('NPSN sekolah tidak ditemukan di Firebase. Minta admin sekolah memastikan sekolah sudah terdaftar sebelum registrasi guru.');
    }

    if(authTab==='school'){
      // Buat sekolah terlebih dahulu agar aturan dapat memverifikasi adminUid pada
      // penulisan profil pengguna berikutnya. Aturan wajib menolak NPSN yang sudah ada.
      await db.ref('schools/'+npsn).set({
        name:field('sekolah').trim(),jenjang:field('jenjang'),adminUid:uid,
        createdAt:firebase.database.ServerValue.TIMESTAMP
      });
      await db.ref('users/'+uid).set({name:nama,role:'admin',npsn});
      await db.ref(`s/${npsn}/members/${uid}`).set({name:nama,role:'admin',status:'aktif',email});
    }else{
      // Rules Firebase memvalidasi keberadaan sekolah ketika profil ditulis;
      // tidak perlu membaca daftar sekolah sebelum profil dibuat.
      const profile={name:nama,role,npsn};
      const member={name:nama,role,kelas,status:role==='guru'?'pending':'aktif',email};
      await db.ref('users/'+uid).set(profile);
      await db.ref(`s/${npsn}/members/${uid}`).set(member);
    }
    registering=false;
    await boot(auth.currentUser);
  }catch(e){
    registering=false;
    // Jika registrasi gagal setelah akun Authentication dibuat, coba bersihkan akun
    // yang baru dibuat agar tidak tertinggal sebagai akun tanpa profil. Jika penghapusan
    // ditolak oleh Firebase, beri tahu pengguna bahwa akun perlu dibersihkan oleh admin.
    let orphanLeft=false;
    if(createdAuth){
      try{
        const u=auth.currentUser;
        if(u && u.uid===uid) await u.delete();
        else orphanLeft=true;
      }catch(cleanErr){ orphanLeft=true; }
      await auth.signOut().catch(()=>{});
    }
    const detail=msg(e);
    throw Error(detail+(orphanLeft?' Akun Firebase sempat dibuat tetapi tidak dapat dibersihkan otomatis. Admin perlu menghapus akun yang belum memiliki profil di Firebase Authentication, lalu coba registrasi kembali.':''));
  }
}
auth.onAuthStateChanged(u=>{if(!registering && me?.role!=='siswa')boot(u)});async function boot(u){const run=++bootId;if(!u){me=null;school=null;mem=null;authView();return}try{const p=await val('users/'+u.uid);if(run!==bootId)return;if(!p){$('app').innerHTML='<div class="auth card"><h2>Profil akun belum tersimpan</h2><p class="err">Akun login ada di Firebase Authentication, tetapi data profilnya tidak ditemukan di Realtime Database pada jalur <code>users/'+esc(u.uid)+'</code>.</p><p>Ini biasanya terjadi jika registrasi sebelumnya terputus atau aturan Firebase menolak penyimpanan profil. Keluar terlebih dahulu. Admin perlu memeriksa Firebase Realtime Database dan Firebase Authentication sebelum akun ini digunakan.</p><button class="btn" onclick="auth.signOut()">Keluar</button></div>';return}me={uid:u.uid,...p};if(!/^\d{8}$/.test(me.npsn||''))throw Error('NPSN profil tidak valid.');[school,mem]=await Promise.all([val('schools/'+me.npsn),val(S('members/'+me.uid))]);if(run!==bootId)return;if(!school||!mem||mem.role!==me.role){$('app').innerHTML='<div class="auth card"><p class="err">Keanggotaan sekolah tidak valid. Hubungi admin.</p><button class="btn" onclick="auth.signOut()">Keluar</button></div>';return}if(mem.status!=='aktif'){$('app').innerHTML=`<div class="auth card"><h2>${mem.status==='pending'?'Menunggu persetujuan':'Akun tidak aktif'}</h2><p>Hubungi admin ${esc(school.name)} untuk mengaktifkan akun.</p><button class="btn" onclick="auth.signOut()">Keluar</button></div>`;return}view='home';shell()}catch(x){if(run===bootId)$('app').innerHTML=`<div class="auth card"><p class="err">${esc(msg(x))}</p><button class="btn" onclick="auth.signOut()">Keluar</button></div>`}}

const THEME_READINGS={
 t1:{title:'Gaya Hidup Berkelanjutan',intro:'Bumi adalah rumah kita bersama. Air, udara, tanah, tumbuhan, dan hewan membantu semua makhluk hidup. Sampah yang dibuang sembarangan dapat menyumbat saluran air dan mencemari lingkungan. Kita bisa menjaga bumi dengan memilah sampah, menggunakan kembali barang yang masih layak, menghemat air dan listrik, serta menanam dan merawat tumbuhan.',examples:'Contoh aksi: membawa botol minum sendiri, mematikan lampu saat tidak dipakai, memakai kedua sisi kertas, dan membuat kompos dari sisa sayuran yang sesuai.',questions:['Masalah lingkungan apa yang kamu lihat di rumah atau sekolah?','Sebutkan dua tindakan yang bisa kamu lakukan untuk mengurangi sampah.','Aksi apa yang akan kamu lakukan selama satu minggu?']},
 t2:{title:'Kearifan Lokal',intro:'Kearifan lokal adalah pengetahuan, kebiasaan, karya, dan nilai baik yang tumbuh di suatu daerah. Contohnya bahasa daerah, cerita rakyat, makanan tradisional, permainan, tarian, musik, kerajinan, serta kebiasaan gotong royong. Setiap daerah memiliki keunikan. Kita dapat mempelajarinya dengan bertanya kepada keluarga atau warga, mendengarkan cerita dengan sopan, dan menjaga tradisi yang baik.',examples:'Contoh kegiatan: wawancara anggota keluarga tentang permainan masa kecil, membuat catatan makanan khas daerah, atau belajar satu lagu atau permainan tradisional.',questions:['Tradisi atau makanan khas apa yang kamu ketahui?','Siapa yang dapat kamu tanya untuk mempelajari budaya daerahmu?','Bagaimana cara menghargai budaya daerah lain?']},
 t3:{title:'Bhinneka Tunggal Ika',intro:'Indonesia memiliki banyak suku, bahasa, adat, dan kebiasaan. Walaupun berbeda, kita tetap dapat berteman dan bekerja sama. Menghargai perbedaan berarti mendengarkan teman, tidak mengejek nama atau kebiasaan orang lain, berbagi kesempatan, dan menyelesaikan masalah dengan kata-kata yang baik. Perundungan bukan candaan jika membuat orang lain takut atau sedih. Jika melihat perundungan, mintalah bantuan guru atau orang dewasa tepercaya.',examples:'Contoh aksi: membuat poster persahabatan, mendengarkan cerita teman, dan menyepakati aturan kelompok agar semua anggota mendapat giliran.',questions:['Apa persamaan yang kamu miliki dengan teman yang berbeda darimu?','Apa yang sebaiknya kamu lakukan jika ada teman diejek?','Tuliskan satu kalimat yang menunjukkan sikap menghargai perbedaan.']},
 t4:{title:'Bangunlah Jiwa dan Raganya',intro:'Tubuh dan perasaan kita sama-sama perlu dijaga. Tubuh sehat terbantu oleh makanan bergizi, air putih, kebersihan, gerak badan, dan tidur cukup. Kesehatan jiwa juga penting. Kita boleh merasa senang, sedih, kecewa, atau khawatir. Mengenali perasaan dan bercerita kepada orang dewasa tepercaya dapat membantu. Kita juga perlu menjaga pertemanan dengan bersikap baik dan menolak perundungan.',examples:'Contoh aksi: bergerak aktif dengan aman, mencuci tangan, memilih makanan beragam, beristirahat dari layar, dan menyampaikan perasaan dengan sopan.',questions:['Kebiasaan apa yang membantu tubuhmu tetap sehat?','Apa yang bisa kamu lakukan saat merasa sedih atau khawatir?','Bagaimana cara membuat kelas terasa aman dan ramah?']},
 t5:{title:'Rekayasa dan Teknologi',intro:'Teknologi adalah alat atau cara yang membantu manusia menyelesaikan masalah. Teknologi tidak selalu berupa komputer; alat sederhana pun dapat menjadi teknologi. Untuk membuat solusi, kita perlu mengamati masalah, mencari ide, menggambar rancangan, memilih bahan yang aman, mencoba, lalu memperbaiki hasilnya. Kegagalan saat mencoba adalah kesempatan untuk belajar. Mintalah bantuan guru saat memakai alat yang tajam, panas, atau berisiko.',examples:'Contoh karya: tempat pensil dari kardus bekas, penyiram tanaman sederhana, atau rancangan penyaring air sebagai model pembelajaran. Air hasil percobaan tidak boleh diminum.',questions:['Masalah apa di kelas atau rumah yang ingin kamu bantu selesaikan?','Alat atau bahan aman apa yang bisa digunakan?','Bagaimana kamu akan menguji apakah idemu berhasil?']},
 t6:{title:'Kewirausahaan',intro:'Kewirausahaan berarti menemukan kebutuhan, membuat sesuatu yang bermanfaat, lalu menjelaskan manfaatnya kepada orang lain. Wirausaha yang baik bersikap jujur, kreatif, bertanggung jawab, dan menjaga kualitas. Saat membuat produk, kita dapat menghitung modal atau biaya bahan, menentukan harga secara wajar, mencatat pemasukan, dan menghitung sisa uang. Bekerja sama dan mendengarkan masukan membantu produk menjadi lebih baik.',examples:'Contoh kegiatan: membuat pembatas buku, menjual hasil kerajinan dalam Market Day dengan izin guru, membuat poster produk, atau berlatih menghitung modal dan harga jual tanpa harus berjualan sungguhan.',questions:['Barang atau jasa apa yang bermanfaat bagi temanmu?','Bahan apa yang dibutuhkan untuk membuatnya?','Mengapa penjual harus jujur dan mencatat uang dengan benar?']}
};

 if(x.type==='page'||x.type==='lesson'||x.type==='gallery') activity=`<h3>📖 Materi untuk poin ini</h3><div style="white-space:pre-wrap;line-height:1.8">${esc(x.reading)}</div><div class="card" style="margin-top:1rem"><b>Yang perlu dilakukan</b><p>${esc(x.description)}</p><label><input id="readConfirm" type="checkbox" ${old.done?'checked':''}> Saya sudah membaca/mempelajari materi ini.</label></div><button class="btn" type="button" onclick="finishRead('${tid}','${aid}')">Simpan selesai membaca</button>`;

 else if(x.type==='assignment'||x.type==='groupassignment'||x.type==='forum') activity=`<h3>${x.type==='forum'?'💬 Jawaban diskusi': '📷 Unggah hasil kegiatan'}</h3><p>${esc(x.description)}</p>${x.type==='forum'?`<label>Jawaban diskusi / cerita pengalaman</label><textarea id="activityText" rows="4" placeholder="Tuliskan jawabanmu...">${esc(old.text||'')}</textarea><label>Atau unggah rekaman suara (opsional)</label>`:`<label>Unggah foto, video, atau dokumen hasil kegiatan</label>`}<input id="activityFile" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" ${isStudent?'':'disabled'}><p class="mut">${old.fileName?'File tersimpan: '+esc(old.fileName):'Pilih file hasil pekerjaan. Batas ukuran 1,5 MB agar dapat disimpan di browser.'}</p><label>Catatan singkat (opsional)</label><textarea id="activityNote" rows="2" placeholder="Ceritakan hasil kegiatan...">${esc(old.note||'')}</textarea><button class="btn" type="button" onclick="saveUploadActivity('${tid}','${aid}','${x.type}')" ${isStudent?'':'disabled'}>Unggah / simpan hasil dan tandai selesai</button>`;
 else if(x.type==='rubric') activity=`<h3>🧭 Penilaian karakter</h3><p>${esc(x.description)}</p><p class="mut">Isi penilaian diri berdasarkan kegiatan yang kamu lakukan. Guru juga dapat menggunakan rubrik ini saat mendampingi siswa.</p>${[['kolaborasi','Kolaborasi'],['mandiri','Kemandirian'],['kritis','Penalaran kritis'],['kreatif','Kreativitas']].map(([k,l])=>`<label>${l}</label><select id="score_${k}"><option value="">Pilih capaian</option>${['BB','MB','BSH','SB'].map(v=>`<option ${old[k]===v?'selected':''}>${v}</option>`).join('')}</select>`).join('')}<label>Catatan guru</label><textarea id="score_note" rows="3">${esc(old.note||'')}</textarea><button class="btn" type="button" onclick="saveRubric('${tid}','${aid}')">Simpan penilaian</button>`;
 else if(x.type==='download') activity=`<h3>📄 Lembar kerja (LKPD)</h3><p>${esc(x.description)}</p><label>Tautan LKPD yang dibagikan guru (jika ada)</label><input id="lkpdUrl" type="url" placeholder="https://..." value="${esc(old.url||'')}"><label><input id="lkpdConfirm" type="checkbox" ${old.done?'checked':''}> Saya sudah membuka/mengunduh dan mengisi LKPD.</label><button class="btn" type="button" onclick="finishDownload('${tid}','${aid}')">Simpan selesai LKPD</button>`;
 else if(x.type==='reflection') activity=`<h3>💭 Refleksi diri</h3><p>${esc(x.description)}</p>${(me.kelas&&parseInt(me.kelas)>=4?x.questions:x.questions.slice(0,1)).map((q,i)=>`<label>${i+1}. ${esc(q)}</label><textarea id="reflect_${i}" rows="3" placeholder="Tuliskan jawabanmu...">${esc(old['q'+i]||'')}</textarea>`).join('')}<label>Perasaan setelah kegiatan</label><select id="reflectMood"><option value="">Pilih perasaan</option>${['😊 Senang','😐 Biasa saja','🙁 Masih kesulitan'].map(v=>`<option ${old.mood===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn" type="button" onclick="saveReflection('${tid}','${aid}')">Simpan refleksi</button>`;
 else if(x.type==='completion'||x.type==='group') activity=`<h3>✅ Konfirmasi kegiatan</h3><p>${esc(x.description)}</p><label>Catatan kegiatan (opsional)</label><textarea id="activityNote" rows="3" placeholder="Apa yang sudah dilakukan?">${esc(old.note||'')}</textarea><label><input id="activityConfirm" type="checkbox" ${old.done?'checked':''}> Kegiatan ini sudah dilakukan sesuai arahan guru.</label><button class="btn" type="button" onclick="finishConfirm('${tid}','${aid}')">Simpan dan tandai selesai</button>`;
 else activity=`<h3>📝 Pertanyaan kegiatan</h3><p>${esc(x.description)}</p>${x.questions.map((q,i)=>`<label>${i+1}. ${esc(q)}</label><textarea id="answer_${i}" rows="3" placeholder="Tuliskan jawabanmu...">${esc(old['q'+i]||'')}</textarea>`).join('')}<button class="btn" type="button" onclick="saveAnswers('${tid}','${aid}',${x.questions.length})">Simpan jawaban dan tandai selesai</button>`;
 $('main').innerHTML=`<div class="actions"><button class="btn sm ghost" onclick="openCourse('${tid}')">← Kembali ke modul</button>${['page','lesson','gallery'].includes(x.type)?`<button class="btn sm ghost" onclick="speakLesson('${tid}','${aid}')">🔊 Bacakan materi</button><button class="btn sm ghost" onclick="if('speechSynthesis' in window)speechSynthesis.cancel()">⏹ Hentikan suara</button>`:''}</div><div class="card"><span class="tag">${esc(t.n)} · ${esc(x.type.toUpperCase())}</span><h2 style="margin-top:.5rem">${esc(x.title)}</h2><p>${esc(x.description)}</p>${activity}${old.done?'<p class="tag" style="margin-top:1rem">✅ Aktivitas ini sudah tersimpan dan checklist terbuka.</p>':''}</div>`;
}
function saveActivity(tid,aid,data,message){const all=readResponses(tid);all[aid]={...data,done:true,savedAt:new Date().toISOString()};try{localStorage.setItem(responseKey(tid),JSON.stringify(all));const d=readCourse(tid);d[aid]=true;localStorage.setItem(courseKey(tid),JSON.stringify(d));toast(message||'Aktivitas tersimpan. Checklist otomatis tercentang.');openCourse(tid)}catch(e){toast('Penyimpanan gagal. Ukuran file mungkin terlalu besar; pilih file di bawah 1,5 MB.')}}
function finishRead(tid,aid){if(!$('readConfirm')?.checked)return toast('Centang konfirmasi setelah membaca materi.');saveActivity(tid,aid,{done:true},'Materi selesai dibaca. Checklist otomatis tercentang.')}
function finishVideo(tid,aid){if(!$('watchedConfirm')?.checked)return toast('Centang konfirmasi setelah menonton video.');saveActivity(tid,aid,{done:true,url:$('videoUrl')?.value.trim()||''},'Video ditandai selesai ditonton.')}
function GenUIOpenVideo(url){try{window.open(url,'_blank','noopener')}catch(e){toast('Tidak dapat membuka tautan video.')}}
function finishDownload(tid,aid){if(!$('lkpdConfirm')?.checked)return toast('Konfirmasi bahwa LKPD sudah dibuka/diunduh dan diisi.');saveActivity(tid,aid,{done:true,url:$('lkpdUrl')?.value.trim()||''},'Aktivitas LKPD selesai.')}
function finishConfirm(tid,aid){if(!$('activityConfirm')?.checked)return toast('Konfirmasi bahwa kegiatan benar-benar sudah dilakukan.');saveActivity(tid,aid,{done:true,note:$('activityNote')?.value.trim()||''},'Kegiatan tersimpan dan checklist otomatis tercentang.')}
function saveAnswers(tid,aid,n){const out={};for(let i=0;i<n;i++)out['q'+i]=$('answer_'+i)?.value.trim()||'';if(!Object.values(out).some(Boolean))return toast('Isi setidaknya satu jawaban.');saveActivity(tid,aid,out,'Jawaban tersimpan dan checklist otomatis tercentang.')}
function saveReflection(tid,aid){const out={mood:$('reflectMood')?.value||''};let n=0;for(let i=0;$('reflect_'+i);i++){out['q'+i]=$('reflect_'+i).value.trim();if(out['q'+i])n++}if(!n&&!out.mood)return toast('Isi refleksi terlebih dahulu.');saveActivity(tid,aid,out,'Refleksi tersimpan dan checklist otomatis tercentang.')}
function saveRubric(tid,aid){const out={};for(const k of ['kolaborasi','mandiri','kritis','kreatif']){out[k]=$('score_'+k)?.value||'';if(!out[k])return toast('Pilih capaian untuk semua aspek penilaian.')}out.note=$('score_note')?.value.trim()||'';saveActivity(tid,aid,out,'Rubrik penilaian tersimpan.')}
function saveUploadActivity(tid,aid,type){const file=$('activityFile')?.files?.[0],text=$('activityText')?.value.trim()||'',note=$('activityNote')?.value.trim()||'';if(!file&&!text&&!note)return toast('Isi jawaban atau pilih file hasil kegiatan terlebih dahulu.');if(file&&file.size>1.5*1024*1024)return toast('Ukuran file maksimal 1,5 MB. Pilih file yang lebih kecil.');const save=data=>saveActivity(tid,aid,{...data,text,note},'Hasil kegiatan tersimpan dan checklist otomatis tercentang.');if(!file)return save({});const reader=new FileReader();reader.onload=()=>save({fileName:file.name,fileType:file.type,fileData:reader.result,fileSize:file.size});reader.onerror=()=>toast('File gagal dibaca. Coba pilih ulang.');reader.readAsDataURL(file)}
function toggleCourse(tid,aid,on){toast('Checklist dibuka otomatis setelah menyelesaikan aktivitasnya. Buka aktivitas untuk mengerjakannya.')}

function printCourseCertificate(tid){if(me.role!=='siswa')return toast('Sertifikat dicetak melalui akun siswa masing-masing.');if(!courseDone(tid))return toast('Selesaikan seluruh aktivitas wajib sebelum mencetak sertifikat.');const t=themeOf(tid),tanggal=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),w=window.open('','_blank');if(!w)return toast('Izinkan pop-up agar sertifikat dapat dicetak.');w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Sertifikat Kokurikuler</title><style>body{font-family:Arial,sans-serif;margin:0;padding:30px;background:#f5faf7}.sert{border:10px double #1f7a5c;min-height:80vh;padding:45px;text-align:center;background:white;display:flex;flex-direction:column;justify-content:center}h1{color:#1f7a5c;font-size:38px;margin:8px}h2{font-size:26px}p{font-size:18px;line-height:1.7}.nama{font-size:30px;font-weight:bold;border-bottom:2px solid #1f7a5c;display:inline-block;padding:8px 30px;margin:15px}@media print{body{padding:0;background:white}.sert{min-height:90vh;break-inside:avoid}}</style></head><body><div class="sert"><p>GERAKAN ANAK INDONESIA HEBAT</p><h1>SERTIFIKAT PENYELESAIAN</h1><h2>Kokurikuler — Aku dan Lingkunganku</h2><p>Diberikan kepada</p><div class="nama">${esc(me.name)}</div><p>Kelas: ${esc(mem?.kelas||'-')}</p><p>Telah menyelesaikan seluruh aktivitas wajib tema<br><strong>${esc(t.n)}</strong></p><p>${esc(semesterOfTheme(tid))} · Tahun ajaran berjalan</p><p>Terbit pada ${tanggal}</p><br><p>Guru Pembimbing<br><br><br>________________________</p></div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}

function newProject(tid){if(me.role==='siswa')return;openModal('Projek baru',`<label>Tema</label><select name="tema">${THEMES.map(t=>`<option value="${t.id}" ${t.id===tid?'selected':''}>${t.n}</option>`).join('')}</select><label>Judul projek</label><input name="jud" required><label>Deskripsi / tujuan</label><textarea name="desk" rows="3"></textarea><label>Kelas (mis. 4A, atau SEMUA)</label><input name="kelas" value="${esc(me.role==='guru'?(mem.kelas||'SEMUA'):'SEMUA')}"><label>Tenggat</label><input name="tgl" type="date"><label>Langkah kegiatan (satu per baris)</label><textarea name="langkah" rows="4"></textarea>`,async f=>{const v=n=>f.elements.namedItem(n).value,kelas=v('kelas').trim().toUpperCase()||'SEMUA';if(me.role==='guru'&&mem.kelas&&kelas!=='SEMUA'&&kelas!==mem.kelas.toUpperCase())throw Error('Guru hanya boleh membuat projek untuk kelas sendiri atau semua kelas.');await db.ref(S('projects')).push({theme:v('tema'),title:v('jud').trim(),desc:v('desk').trim(),kelas,deadline:v('tgl'),steps:v('langkah').split('\n').map(s=>s.trim()).filter(Boolean),by:me.uid,byName:me.name,at:firebase.database.ServerValue.TIMESTAMP})})}
async function vProjects(){const pr=await val(S('projects')),k=(mem?.kelas||'').toUpperCase();const list=Object.entries(pr||{}).filter(([,p])=>me.role==='admin'||p.kelas==='SEMUA'||p.kelas===k||(me.role==='guru'&&p.by===me.uid)).sort((a,b)=>(b[1].at||0)-(a[1].at||0));let subs={};if(me.role==='siswa'){const mine=await Promise.all(list.map(async([id])=>[id,await val(S(`subs/${id}/${me.uid}`))]));for(const [id,v] of mine)if(v)subs[id]={[me.uid]:v};}else{const perProject=await Promise.all(list.map(async([id])=>[id,await val(S(`subs/${id}`)).catch(()=>null)]));for(const [id,v] of perProject)if(v)subs[id]=v;}const head=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem"><h2>Projek Kokurikuler</h2>${me.role!=='siswa'?'<button class="btn" onclick="newProject()">+ Projek baru</button>':''}</div>`;if(!list.length)return head+'<div class="card"><p>Belum ada projek untuk kelas Anda.</p></div>';return head+`<div class="grid">${list.map(([id,p])=>{const t=themeOf(p.theme),my=subs?.[id]?.[me.uid],cnt=Object.keys(subs?.[id]||{}).length;return `<div class="card"><span class="tag">${t.i} ${t.n}</span><h3 style="margin-top:.5rem">${esc(p.title)}</h3><p>${esc(p.desc)}</p><p class="mut">Kelas ${esc(p.kelas)} · Guru ${esc(p.byName)}${p.deadline?' · Tenggat '+esc(p.deadline):''}</p>${p.steps?.length?`<ol>${p.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}${me.role==='siswa'?`${my?`<p class="tag sun">Terkirim${my.nilai!=null?' · Nilai '+esc(my.nilai):''}</p>${my.feedback?`<p class="mut">Catatan guru: ${esc(my.feedback)}</p>`:''}`:''}<p><button class="btn sm" onclick="submitWork('${id}')">${my?'Ubah laporan':'Kumpulkan laporan'}</button></p>`:`<div class="actions"><button class="btn sm" onclick="reviewWork('${id}')">Lihat pengumpulan (${cnt})</button>${(me.role==='admin'||p.by===me.uid)?`<button class="btn sm red" onclick="delProject('${id}')">Hapus</button>`:''}</div>`}</div>`}).join('')}</div>`}
async function submitWork(pid){if(me.role!=='siswa')return;const p=await val(S('projects/'+pid));if(!p||!(p.kelas==='SEMUA'||p.kelas===(mem.kelas||'').toUpperCase()))throw Error('Projek tidak tersedia untuk kelas Anda.');const old=await val(S(`subs/${pid}/${me.uid}`))||{};openModal('Laporan projek',`<label>Ceritakan yang kamu kerjakan</label><textarea name="isi" rows="5" required>${esc(old.text)}</textarea><label>Tautan foto/video/dokumen (opsional)</label><input name="link" type="url" value="${esc(old.link)}">`,async f=>{const v=n=>f.elements.namedItem(n).value;await db.ref(S(`subs/${pid}/${me.uid}`)).update({name:me.name,kelas:mem?.kelas||'',text:v('isi').trim(),link:v('link').trim(),at:firebase.database.ServerValue.TIMESTAMP})})}
async function reviewWork(pid){if(me.role==='siswa')return;const p=await val(S('projects/'+pid));if(!p||!(me.role==='admin'||p.by===me.uid||p.kelas==='SEMUA'||p.kelas===(mem.kelas||'').toUpperCase()))return toast('Akses projek ditolak.');const subs=await val(S('subs/'+pid))||{},members=await val(S('members'))||{};const e=Object.entries(subs).filter(([u,s])=>me.role==='admin'||(members[u]?.kelas||s.kelas||'').toUpperCase()===(mem.kelas||'').toUpperCase());openModal('Pengumpulan siswa',e.length?e.map(([u,s])=>`<div class="card" style="margin-bottom:.6rem"><b>${esc(s.name)}</b> <span class="mut">${esc(s.kelas)}</span><p>${esc(s.text)}</p>${/^https?:\/\//i.test(s.link||'')?`<p><a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">Buka tautan</a></p>`:''}<label>Nilai (0–100)</label><input name="n_${u}" type="number" min="0" max="100" value="${esc(s.nilai??'')}"><label>Umpan balik</label><input name="f_${u}" value="${esc(s.feedback||'')}"></div>`).join(''):'<p>Belum ada yang mengumpulkan.</p>',async f=>{const updates={};for(const [u] of e){const n=f.elements.namedItem('n_'+u).value;updates[`subs/${pid}/${u}/nilai`]=n===''?null:Number(n);updates[`subs/${pid}/${u}/feedback`]=f.elements.namedItem('f_'+u).value.trim()}if(Object.keys(updates).length)await db.ref(S('')).update(updates)})}
async function delProject(pid){if(me.role==='siswa')return;const p=await val(S('projects/'+pid));if(!p||(me.role!=='admin'&&p.by!==me.uid))return toast('Tidak memiliki izin menghapus projek.');if(confirm('Hapus projek beserta seluruh laporan siswa?')){await db.ref(S('')).update({['projects/'+pid]:null,['subs/'+pid]:null});go('projects')}}
async function vKaih(){if(me.role!=='siswa')return `<h2>7 Kebiasaan Anak Indonesia Hebat</h2><div class="grid">${KAIH.map(h=>`<div class="card"><h3>${h.i} ${h.n}</h3>${h.w?`<span class="tag sun">${h.w}</span>`:''}<p>${esc(h.d)}</p></div>`).join('')}</div><p class="mut">Siswa mengisi checklist harian; guru melihat rekap di menu Rekap kebiasaan.</p>`;const all=await val(S('kaih/'+me.uid))||{},days=lastDays(7),td=all[today()]||{};return `<h2>Checklist kebiasaan hari ini</h2><p class="mut">${today()} — centang yang sudah kamu lakukan.</p>${KAIH.map(h=>{const wk=days.filter(d=>all[d]?.[h.id]===true).length;return `<label class="hab ${td[h.id]===true?'done':''}"><input type="checkbox" ${td[h.id]===true?'checked':''} onchange="toggleHab('${h.id}',this.checked)"><span style="flex:1"><b>${h.i} ${h.n}</b> ${h.w?`<span class="tag sun">${h.w}</span>`:''}<br><span class="mut">${esc(h.d)}</span><div class="bar" style="margin-top:.4rem"><i style="width:${wk/7*100}%"></i></div><span class="mut">${wk}/7 hari minggu ini</span></span></label>`}).join('')}`}
async function toggleHab(id,on){if(me.role!=='siswa'||!KAIH.some(h=>h.id===id))return;try{const r=db.ref(S(`kaih/${me.uid}/${today()}/${id}`));on?await r.set(true):await r.remove();await go('kaih')}catch(x){toast(msg(x));go('kaih')}}
async function vRekap(){if(me.role==='siswa')throw Error('Tidak memiliki akses.');const members=await val(S('members'))||{};const sis=Object.entries(members).filter(([,m])=>m.role==='siswa'&&m.status==='aktif'&&(me.role==='admin'||(m.kelas||'').toUpperCase()===(mem.kelas||'').toUpperCase()));const kelas=[...new Set(sis.map(([,m])=>m.kelas).filter(Boolean))].sort();if(me.role==='guru')rekapKelas=mem.kelas||'';const rows=sis.filter(([,m])=>!rekapKelas||m.kelas===rekapKelas).sort((a,b)=>(a[1].kelas||'').localeCompare(b[1].kelas||'')||a[1].name.localeCompare(b[1].name));const results=await Promise.all(rows.map(async([u])=>{try{return await val(S(`kaih/${u}/${rekapDate}`))||{}}catch{return {}}}));return `<h2>Rekap 7 Kebiasaan</h2><div class="row" style="justify-content:flex-start;margin:0 0 .8rem"><input type="date" style="width:auto" value="${esc(rekapDate)}" onchange="rekapDate=this.value;go('rekap')"><select style="width:auto" ${me.role==='guru'?'disabled':''} onchange="rekapKelas=this.value;go('rekap')"><option value="">Semua kelas</option>${kelas.map(k=>`<option value="${esc(k)}" ${k===rekapKelas?'selected':''}>${esc(k)}</option>`).join('')}</select><button class="btn sm ghost" onclick="window.print()">Cetak</button></div><div class="card scroll"><table><tr><th>Nama</th><th>Kelas</th>${KAIH.map(h=>`<th title="${esc(h.n)}">${h.i}</th>`).join('')}<th>Total</th></tr>${rows.map(([u,m],i)=>{const d=results[i];return `<tr><td>${esc(m.name)}</td><td>${esc(m.kelas)}</td>${KAIH.map(h=>`<td>${d[h.id]===true?'✅':'–'}</td>`).join('')}<td><b>${countHab(d)}/7</b></td></tr>`}).join('')||'<tr><td colspan="10">Belum ada siswa.</td></tr>'}</table></div>`}
async function vUsers(){if(me.role!=='admin')throw Error('Akses khusus admin.');const ms=Object.entries(await val(S('members'))||{});return `<h2>Pengguna sekolah</h2><p class="mut">Bagikan NPSN <b>${esc(me.npsn)}</b> kepada guru dan siswa agar bisa mendaftar.</p><div class="card scroll"><table><tr><th>Nama</th><th>Peran</th><th>Kelas</th><th>Email</th><th>Status</th><th>Aksi</th></tr>${ms.map(([u,m])=>`<tr><td>${esc(m.name)}</td><td>${esc(m.role)}</td><td>${esc(m.kelas)}</td><td>${esc(m.email)}</td><td><span class="tag ${m.status==='aktif'?'':'sun'}">${esc(m.status)}</span></td><td>${m.role!=='admin'?`<button class="btn sm ${m.status==='aktif'?'ghost':''}" onclick="setStatus('${u}','${m.status==='aktif'?'nonaktif':'aktif'}')">${m.status==='aktif'?'Nonaktifkan':'Aktifkan'}</button>`:''}</td></tr>`).join('')}</table></div>`}async function setStatus(u,s){if(me.role!=='admin'||u===me.uid)return;try{const m=await val(S('members/'+u));if(!m||m.role==='admin')throw Error('Tidak boleh mengubah status admin.');await db.ref(S(`members/${u}/status`)).set(s);go('users')}catch(x){toast(msg(x))}}
const bpath=p=>p.trim().replace(/\{npsn\}/g,me.npsn).replace(/^\/+|\/+$/g,''),norm=v=>(Array.isArray(v)?v.map((x,i)=>[String(i),x]):Object.entries(v||{})).filter(([,x])=>x&&typeof x==='object');async function vImport(){if(me.role!=='admin')throw Error('Akses khusus admin.');return `<h2>Impor data dari Firebase cadangan</h2><p class="mut">Data dibaca dari database cadangan. Pastikan path/kolom NPSN hanya milik sekolah <b>${esc(me.npsn)}</b>. Gunakan <code>{npsn}</code> untuk path yang dikelompokkan berdasarkan sekolah.</p><div class="card"><h3>1. Profil sekolah</h3><label>Path data sekolah di cadangan</label><input id="imSek" placeholder="mis. sekolah/{npsn}"><p><button class="btn sm" onclick="impSchool()">Ambil profil sekolah</button></p></div><div class="card" style="margin-top:.9rem"><h3>2. Data siswa</h3><label>Path data siswa di cadangan</label><input id="imPath" placeholder="mis. siswa/{npsn}"><p><button class="btn sm" onclick="impPreview()">Pratinjau</button></p><div id="imBox"></div><p id="imLog" class="mut"></p></div>`}
async function impSchool(){if(me.role!=='admin')return;try{const path=bpath($('imSek').value);if(!path)throw Error('Isi path data sekolah.');const v=(await bdb.ref(path).get()).val();if(!v)throw Error('Data tidak ditemukan atau akses ditolak.');const o=[v,...Object.values(v).filter(x=>x&&typeof x==='object')].find(x=>String(x.npsn||'')===me.npsn)||(String(v.npsn||'')===me.npsn?v:null);if(!o)throw Error('NPSN sekolah tidak cocok. Pastikan data memiliki kolom NPSN.');const upd={name:o.nama_sekolah||o.nama||o.name||o.sekolah||school.name,jenjang:o.jenjang||school.jenjang,alamat:o.alamat||''};if(!confirm(`Perbarui profil sekolah?\nNama: ${upd.name}\nJenjang: ${upd.jenjang}\nAlamat: ${upd.alamat||'-'}`))return;await db.ref('schools/'+me.npsn).update(upd);school={...school,...upd};toast('Profil sekolah diperbarui.');shell();go('import')}catch(x){toast(msg(x))}}
async function impPreview(){if(me.role!=='admin')return;const box=$('imBox');box.textContent='Membaca…';try{const path=bpath($('imPath').value);if(!path)throw Error('Isi path data siswa.');impRows=norm((await bdb.ref(path).get()).val());if(!impRows.length)throw Error('Tidak ada data atau akses ditolak.');const keys=[...new Set(impRows.slice(0,50).flatMap(([,r])=>Object.keys(r)))];const g={nama:/^(nama|name)|nama_?siswa|lengkap/i,kelas:/kelas|rombel|class/i,nisn:/nisn|^nis$/i,npsn:/npsn/i};const sel=(k,l)=>`<label>${l}</label><select id="im_${k}"><option value="">(tidak ada)</option>${keys.map(c=>`<option value="${esc(c)}" ${g[k].test(c)?'selected':''}>${esc(c)}</option>`).join('')}</select>`;box.innerHTML=`<p class="tag">${impRows.length} data ditemukan</p><pre class="mut" style="white-space:pre-wrap;overflow:auto;max-height:8rem">${esc(JSON.stringify(impRows[0][1],null,2))}</pre>${sel('nama','Kolom nama')}${sel('kelas','Kolom kelas')}${sel('nisn','Kolom NISN/NIS (identitas akun)')}${sel('npsn','Kolom NPSN (filter sekolah)')}<label>Kata sandi awal (minimal 8 karakter; bagikan secara pribadi dan segera ganti)</label><input id="imPw" type="password" minlength="8" placeholder="Buat kata sandi sementara yang kuat"><p><button class="btn" onclick="impRun()">Impor siswa</button></p>`}catch(x){box.innerHTML=`<p class="err">${esc(msg(x))}</p>`}}
async function impRun(){if(me.role!=='admin')return;const m={};['nama','kelas','nisn','npsn'].forEach(k=>m[k]=$('im_'+k).value);if(!m.nama||!m.kelas||!m.npsn)return toast('Pilih kolom nama, kelas, dan NPSN untuk mencegah pencampuran data sekolah.');const rows=impRows.filter(([,r])=>String(r[m.npsn]??'').trim()===me.npsn);if(!rows.length)return toast('Tidak ada siswa dengan NPSN yang cocok.');const pw=$('imPw').value;if(pw.length<8)return toast('Kata sandi awal minimal 8 karakter.');if(!confirm(`Buat akun untuk ${rows.length} siswa dengan NPSN ${me.npsn}?`))return;const log=$('imLog');impAcc=[];let ok=0,skip=0,fail=0;const seen=new Set();for(const [id,r] of rows){const nama=String(r[m.nama]??'').trim(),kelas=String(r[m.kelas]??'').trim().toUpperCase(),nisn=String(r[m.nisn]??'').replace(/\D/g,'');if(!nama||!kelas){fail++;continue}const ident=(nisn||String(id).replace(/[^a-z0-9]/gi,'')).toLowerCase();if(!ident||seen.has(ident)){skip++;continue}seen.add(ident);const email=ident+'@'+me.npsn+'.lms';log.textContent=`Memproses ${ok+skip+fail+1}/${rows.length}: ${nama}`;try{const uid=(await sAuth.createUserWithEmailAndPassword(email,pw)).user.uid;await sDb.ref('users/'+uid).set({name:nama,role:'siswa',npsn:me.npsn});await sDb.ref(`s/${me.npsn}/members/${uid}`).set({name:nama,role:'siswa',kelas,status:'aktif',email,nisn});impAcc.push([nama,kelas,email,pw]);ok++}catch(x){if(x.code==='auth/email-already-in-use')skip++;else{fail++;console.warn('Impor gagal',nama,x)}}finally{await sAuth.signOut().catch(()=>{})}}log.innerHTML=`Selesai: ${ok} akun dibuat, ${skip} dilewati/sudah ada, ${fail} gagal. ${ok?'<button class="btn sm" onclick="impCsv()">Unduh daftar akun (CSV)</button>':''}<p class="mut">Simpan CSV secara aman dan hapus setelah kredensial dibagikan.</p>`}
function impCsv(){if(me.role!=='admin'||!impAcc.length)return;const q=s=>'"'+String(s).replace(/"/g,'""').replace(/^[=+@\-]/,'\'$&')+'"';const csv='\ufeffNama,Kelas,Email login,Kata sandi awal\n'+impAcc.map(r=>r.map(q).join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='akun-siswa-'+me.npsn+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
</script></body></html>
